version: 2
updates:
  - package-ecosystem: gradle
    directory: /android-app
    schedule:
      interval: weekly
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*"]
  - package-ecosystem: pip
    directory: /macos-agent
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
